<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WORLD BOSS — prototipe v1 (T14 / ui-ux)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Tema gelap lobby, PANEL SOLID, tanpa backdrop-filter / glow tepi / partikel.
   Animasi hanya transform/opacity. Aset asli: ../assets/raid, ../assets/cards/thumb, ../assets/ui. */
*{box-sizing:border-box;margin:0;padding:0}
*,*::before,*::after{border-radius:0!important}
:root{
  --bg:#0a0f18; --panel:#171012; --panel2:#160c0f; --steel:#12182a; --line:#243150;
  --ink:#F4F7FA; --muted:#9AA6B2; --dim:#5b6675;
  --cyan:#35e0ff; --mag:#ff2e88; --violet:#B98CFF; --gold:#E0BC6E; --green:#2ED573; --crimson:#f43f5e;
  --fd:'Orbitron','Rajdhani',system-ui,sans-serif; --fb:'Rajdhani','Segoe UI',system-ui,sans-serif; --fm:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --gap:8px; --chamf:9px;
  --tex:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,0) 1px 3px),repeating-linear-gradient(0deg,rgba(53,224,255,.05) 0 1px,rgba(0,0,0,0) 1px 24px),repeating-linear-gradient(90deg,rgba(53,224,255,.05) 0 1px,rgba(0,0,0,0) 1px 24px);
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.35 var(--fb);overflow:hidden;
  display:flex;flex-direction:column}
/* ===== TOP BAR ===== */
.top{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;padding:3px 4px;background-color:var(--steel);background-image:var(--tex);border:1px solid rgba(53,224,255,.22);position:relative;clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%)}
.top .brand{order:1;font-family:var(--fd);font-weight:800;letter-spacing:.04em;font-size:9.5px;color:var(--ink);white-space:nowrap}
.top .bico{width:16px;height:16px;flex:none;background-color:var(--gold);-webkit-mask:var(--im) center/contain no-repeat;mask:var(--im) center/contain no-repeat}
.bsw{display:flex;flex-direction:column;gap:3px;margin:0;flex:none;width:100%;min-width:0}
.bsw button{flex:none;width:100%;min-height:22px;padding:2px 2px;font-size:8px;letter-spacing:0}
.subbar .ghead{margin-left:auto;display:flex;align-items:baseline;gap:4px}
.subbar .gnum b{font-size:11px}
.subbar .gnum small{font-size:8.5px}
.bsw button{flex:none;width:100%;min-height:22px;padding:2px 4px;font-size:8.5px;letter-spacing:.02em;text-align:center}
.bsw button{border:1px solid currentColor;background:var(--panel);color:var(--muted);padding:4px 8px;
  font-family:var(--fm);font-size:9.5px;font-weight:700;letter-spacing:.08em;cursor:pointer;white-space:nowrap;clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%)}
.bsw button.on{background:rgba(255,255,255,.12)}
.top .live{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:9px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.top .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blip 1.6s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:.35}50%{opacity:1}}
.top .x{display:none;width:30px;height:30px;flex:none;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--muted);
  display:grid;place-items:center;cursor:pointer}
.subbar{order:-1;flex:none;display:flex;align-items:center;gap:6px;padding:4px 10px;background-color:var(--panel2);background-image:var(--tex);border-bottom:1px solid rgba(53,224,255,.22);
  font-size:9.5px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%)}
.subbar .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;animation:blip 1.6s ease-in-out infinite}
.subbar .reset{white-space:nowrap}
.subbar .mock{margin-left:8px;border:1px solid var(--gold);color:var(--gold);border-radius:5px;padding:1px 5px;font-size:9px;letter-spacing:.06em;font-weight:700}
.subbar .gate{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.subbar .gate.ok{color:var(--green)} .subbar .gate.bad{color:var(--crimson)}
/* ===== STAGE (LAPIS 1) — T28 asimetris: kolom kiri + art kanan ===== */
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:6px 8px;position:relative}
.stagebody{flex:1 1 auto;min-height:0;display:flex;flex-direction:row;gap:8px;align-items:stretch}
.col{flex:0 0 clamp(48px,13vw,64px);min-width:0;position:relative;padding-bottom:12px;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.eyebrow{flex:none;width:100%;box-sizing:border-box;padding:4px 2px;font-family:var(--fd);font-size:8.5px;font-weight:800;line-height:1.15;letter-spacing:.06em;color:var(--muted);text-align:center;text-transform:uppercase;background-color:var(--panel2);background-image:var(--tex);border:1px solid rgba(53,224,255,.22);clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%)}
.skillbar{position:absolute;left:8px;top:8px;z-index:4;display:flex;flex-direction:row;gap:4px}
.skillbar .chip{flex:none;width:auto;border:1px solid rgba(53,224,255,.28);background:var(--panel2);opacity:.95;clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%)}
.gcol{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:4px}
.ghead{flex:none;display:flex;align-items:baseline;gap:5px}
.ghead .poolic{width:14px;height:14px;flex:none}
.gnum{font-family:var(--fm);line-height:1;min-width:0}
.gnum b{font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.gnum small{font-size:9px;color:var(--dim);font-weight:600;white-space:nowrap}
.bossname-wrap{position:absolute;left:0;right:0;bottom:0;z-index:4;max-width:100%;padding:7px 9px 8px;background:var(--panel);
  border-top:1px solid rgba(255,255,255,.10);box-shadow:0 -6px 14px rgba(0,0,0,.45)}
.bossart{flex:1 1 auto;min-width:0;min-height:0;background-color:var(--panel);background-image:var(--tex),radial-gradient(120% 95% at 62% 30%,rgba(30,44,70,.9),rgba(30,44,70,0) 72%);border:1px solid rgba(53,224,255,.28);overflow:hidden;position:relative;
  clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%);
  box-shadow:0 10px 22px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06)}
.bossart img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;right:0;left:auto}
.bossart::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 100% at 50% 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.5) 100%)}
@keyframes glitch{0%{transform:translate(0,0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,2px)}80%{transform:translate(1px,-2px)}100%{transform:translate(0,0)}}
.bossart.glitch{animation:glitch 120ms steps(2,end)}
.bossname{font-family:var(--fd);font-size:clamp(11px,3.2vw,15px);font-weight:800;letter-spacing:0;line-height:1.06;
  text-transform:uppercase;text-wrap:balance;
  color:#fff;text-shadow:0 1px 0 #000,0 2px 2px rgba(0,0,0,.9),0 4px 10px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.9)}
.chip{border:0;padding:3px 7px;font-family:var(--fm);font-size:8.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--dim);font-weight:600;letter-spacing:.06em;margin-right:4px}
/* gauge HP VERTIKAL (T28): 5 fase tersusun bawah->atas, node reward nempel di batas segmen */
.gauge{position:relative;flex:1 1 auto;min-height:0;width:100%;align-self:stretch;
  background-color:var(--steel);background-image:var(--tex);border:1px solid rgba(53,224,255,.28);overflow:hidden;clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%)}
.gfill{position:absolute;left:0;right:0;bottom:0;height:38%;opacity:.9;
  background:linear-gradient(0deg,rgba(53,224,255,.30) 0%,rgba(53,224,255,.30) 60%,var(--cyan) 60%,var(--cyan) 100%)}
.gtick{position:absolute;left:0;right:0;height:1px;background:rgba(53,224,255,.30);z-index:2}
.gtick.minor{background:rgba(53,224,255,.14)}
.gmark{position:absolute;left:-2px;right:-2px;height:2px;background:var(--ink);opacity:.95;z-index:4}
.gph{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(38% + 4px);font-family:var(--fm);font-size:8px;font-weight:700;color:var(--ink);z-index:5;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.9)}
.gnode{position:absolute;right:1px;bottom:0;transform:translateY(50%);width:18px;height:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 44%),var(--steel);
  border:2px solid var(--ring,var(--line));display:grid;place-items:center;box-sizing:border-box;z-index:3;clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%)}
.gnode .gi{width:12px;height:12px;background-color:var(--ic);-webkit-mask:var(--im) center/contain no-repeat;mask:var(--im) center/contain no-repeat}
.gnode .gnum2{display:none}
.gnode[data-i="0"]{transform:translateY(0)}
.gnode.broken{border-color:rgba(255,255,255,.22);background:#0c1119}
.gnode.broken .gi{opacity:.45}
.gnode.broken::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:2px;background:var(--green);opacity:.55;transform:translate(-50%,-50%) rotate(-32deg)}
/* rail reward (kolom ke-3 landscape; disembunyikan di portrait) */
.rail{display:none;flex:1 1 auto;min-width:0;position:relative;flex-direction:column;justify-content:space-evenly;gap:2px;background-color:var(--panel);background-image:var(--tex);border:1px solid rgba(53,224,255,.22);padding:8px 9px;overflow:hidden;clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%)}
.rail .rh{font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
.rrow{display:flex;align-items:center;gap:4px;padding:9px 0;border-bottom:1px solid rgba(53,224,255,.18)}
.rrow:last-child{border-bottom:0}
.rrow .ric{width:28px;height:28px;flex:none;background-color:var(--ic);-webkit-mask:var(--im) center/contain no-repeat;mask:var(--im) center/contain no-repeat}
.rrow .rlb{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.02em;white-space:nowrap}
.rrow .rph{font-family:var(--fm);font-size:9px;color:var(--dim);margin-left:auto}
.rrow .rst{font-family:var(--fm);font-size:9px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border:1px solid var(--line);white-space:nowrap;flex:none;clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%)}
.rrow.done .rst{color:var(--green);border-color:rgba(46,213,115,.5)}
.rrow.cur .rst{color:var(--cyan);border-color:var(--cyan)}
.rrow.lock .rst{color:var(--dim)}
.rrow.done .ric{opacity:.5}
.gnode.hit{border-color:var(--cyan)}
.gnode.hit .gnum2{color:var(--cyan)}
.gnode.broken{border-color:rgba(255,255,255,.22);background:#0c1119}
.gnode.broken .gi{opacity:.45}
.gnode.broken::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:2px;background:var(--green);opacity:.55;transform:translate(-50%,-50%) rotate(-32deg)}
/* ===== FEED (LAPIS 2) ===== */
.feed{flex:0 0 auto;min-height:56px;max-height:150px;overflow:hidden;display:flex;flex-direction:column;background:var(--steel);border-top:1px solid var(--line)}
.feed-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--line)}
.feed-head .lbl{font-family:var(--fm);font-size:9.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.feed-head .rank{font-family:var(--fm);font-size:10.5px;color:var(--ink);font-weight:700}
.feed-head .rank .d{color:var(--muted)}
.feed-body{flex:1;min-height:0;overflow-y:auto;padding:6px 10px;scrollbar-width:none}
.feed-body::-webkit-scrollbar{display:none}
.frow{display:flex;align-items:center;gap:8px;min-height:44px;padding:9px 0;border-bottom:1px solid var(--line)}
.frow .rk{font-family:var(--fm);font-size:11px;color:var(--dim);width:20px;text-align:right;flex:none}
.frow .av{width:24px;height:24px;border-radius:6px;background:var(--panel);border:1px solid var(--line);overflow:hidden;flex:none}
.frow .av img{width:100%;height:100%;object-fit:cover}
.frow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:600}
.frow .dm{font-family:var(--fm);font-variant-numeric:tabular-nums;font-weight:700;color:var(--mag);margin-left:auto}
.frow .tm{font-family:var(--fm);font-size:9.5px;color:var(--dim);flex:none}
.frow.fresh{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:none}50%{opacity:.72;transform:translateX(2px)}}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:var(--muted);padding:8px 10px;position:relative;overflow:hidden}
.empty .wm{width:40px;height:40px;opacity:.5;background:var(--muted);-webkit-mask:url('../assets/icons/crossed-swords.svg') center/contain no-repeat;mask:url('../assets/icons/crossed-swords.svg') center/contain no-repeat}
.empty .big{font-family:var(--fd);font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ink);text-transform:uppercase}
.empty .sm{font-size:10.5px;max-width:none;position:relative}
/* ===== DOCK (LAPIS 3) ===== */
.dock{flex:none;position:relative;background-color:var(--panel);background-image:var(--tex);border-top:1px solid rgba(53,224,255,.22);padding:8px 10px 10px;
  clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%)}
.dock .actrow{display:flex;align-items:center;gap:8px;margin-top:7px}
.dock .actrow .dstats{display:flex;gap:8px;align-items:center;font-family:var(--fm);font-size:10px;color:var(--muted)}
.dock .actrow .dstats b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.mtag{font-size:8px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:0 3px;margin-left:5px;vertical-align:1px;letter-spacing:.04em}
.deckline{display:flex;gap:8px;align-items:center}
.deck{display:flex;gap:6px;flex:1;min-width:0}
.slot{flex:1;min-width:0;height:64px;overflow:hidden;border:2px solid var(--line);background:var(--steel);position:relative;
  clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%)}
.slot.lead{border-color:var(--cyan)} .slot.mid{border-color:var(--gold)} .slot.sup{border-color:var(--violet)} .slot.res{border-color:var(--muted)}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .r{position:absolute;left:0;right:0;bottom:0;background:rgba(10,15,24,.9);font-family:var(--fm);font-size:7px;line-height:1.12;text-align:center;padding:2px 2px;color:var(--ink);white-space:normal;overflow:hidden;text-overflow:clip;word-break:break-word}
.att{display:flex;gap:7px;align-items:center;min-width:0}
#crystals{display:inline-flex;gap:7px;align-items:center}
.crlbl{font-family:var(--fm);font-size:9.5px;color:var(--muted);letter-spacing:.04em;font-weight:700}
.hico{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:7px;background-color:#160008;-webkit-mask:var(--im) center/contain no-repeat;mask:var(--im) center/contain no-repeat}
.cr{width:16px;height:16px;transform:rotate(45deg);border:2px solid var(--line);background:transparent;clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%)}
.cr.on{border-color:var(--cyan);background:linear-gradient(135deg,#8ff6ff,var(--cyan))}
.cr.off{border-color:var(--dim);box-shadow:inset 0 0 0 2px #0c1119}
.hammer{flex:0 0 auto;min-width:128px;min-height:44px;box-sizing:border-box;margin-left:auto;text-align:center;border:0;padding:12px 16px;font-family:var(--fd);font-size:15px;font-weight:800;letter-spacing:.08em;
  color:#160008;background:linear-gradient(180deg,#ff6b86,var(--crimson));cursor:pointer;position:relative;overflow:hidden;
  clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%)}
.hammer::before{content:"";position:absolute;top:0;left:0;width:35%;height:100%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-150%) skewX(-18deg);animation:hsw 3.4s ease-in-out infinite}
@keyframes hsw{0%{transform:translateX(-150%) skewX(-18deg)}55%,100%{transform:translateX(360%) skewX(-18deg)}}
.hammer:active{transform:scale(.98)}
/* ===== T18: mode dev + milestone gabungan + ikon mask ===== */
.devonly{display:none;align-items:center;gap:6px}
body.dev .devonly{display:inline-flex}
.mockcorner{position:absolute;left:10px;bottom:42px;z-index:3;font-family:var(--fm);font-size:7px;letter-spacing:.08em;color:var(--gold);opacity:.5;pointer-events:none;background:rgba(6,10,18,.6);padding:1px 4px}
.pcode{position:absolute;z-index:6;font-family:var(--fm);font-size:7px;font-weight:700;letter-spacing:.1em;color:var(--cyan);opacity:.85;pointer-events:none;text-transform:uppercase;line-height:1}
.pcode.pc-col{bottom:2px;left:2px;top:auto;white-space:nowrap}.pcode.pc-rail{top:2px;right:2px}
.bossrow{position:relative}
.ci,.si{width:12px;height:12px;display:inline-block;vertical-align:-2px;margin-right:5px;background-color:var(--ic);
  -webkit-mask:var(--im) center/contain no-repeat;mask:var(--im) center/contain no-repeat}
.poolic{width:16px;height:16px;background-color:var(--muted);-webkit-mask:var(--im) center/contain no-repeat;mask:var(--im) center/contain no-repeat}

@media (max-width:399px){.skillbar .chip{font-size:7.5px;padding:2px 4px}}
/* ===== LANDSCAPE pendek: 3 pane berisi — col(eyebrow+tab+gauge) kiri | art tengah | dock kanan; status = pita atas full-width ===== */
@media (orientation:landscape){
  body{flex-direction:row}
  /* subbar jadi PITA ATAS full-width (bukan kolom mati kiri); stage+dock padding-top mengosongkan pita */
  .subbar{position:absolute;top:0;left:0;right:0;z-index:6;order:0;flex:none;align-self:auto;width:auto;
    display:flex;align-items:center;gap:8px;padding:3px 10px;font-size:8px;letter-spacing:0;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:0}
  .subbar .reset{font-size:8px;letter-spacing:0}
  .subbar .ghead{margin-left:auto}
  .stage{flex:1 1 auto;min-width:0;min-height:0;padding:26px 6px 6px}
  .dock{flex:none;width:236px;border-top:0;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-evenly;padding-top:26px}
  /* 3 pane nyata: col(eyebrow+tab+gauge) | art(rasio, no band) | rail(reward) | dock */
  .col{flex:0 0 150px;min-width:0;gap:6px;align-items:stretch}
  .eyebrow{font-size:9px}
  .bsw{flex-direction:row;gap:4px}
  .bsw button{flex:1;min-height:30px;font-size:9px}
  .gauge{margin:0}
  .gauge .gnode{display:none}
  .bossart{flex:0 0 auto;width:auto;height:100%;aspect-ratio:var(--ar,0.732)}
  .bossart img{position:absolute;inset:0;margin:auto;width:100%;height:100%;object-fit:contain}
  .bossart .skillbar{left:8px;top:8px}
  .bossart .lb{right:8px;top:8px}
  .bossname{font-size:11.5px}
  .rail{display:flex}
  .skillbar .chip{font-size:7px;padding:2px 4px}
  .deckline{flex-direction:column;align-items:stretch;gap:6px}
  .deck{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;width:100%}
  .slot{width:auto;height:132px}
  .actrow{margin-top:0}
}
/* ===== T22: tombol leaderboard header + modal papan peringkat ===== */
.bossart .lb{position:absolute;right:8px;top:8px;z-index:4;width:44px;height:44px;flex:none;border:1px solid rgba(53,224,255,.3);background:var(--panel);display:grid;place-items:center;cursor:pointer;clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%)}
.bossart .lb:active{transform:scale(.96)}
.bossart .lb .lbi{width:22px;height:22px;background-color:var(--gold);-webkit-mask:var(--im) center/contain no-repeat;mask:var(--im) center/contain no-repeat}

<script>
/* ===== DATA NYATA (dari rekon; angka state = mock, bukan mekanik baru) ===== */
const WB_POOL_HP=1e10;
const BOSSES={
  a:{name:"ETERNAL DRAGON",tag:"EX · WORLD BOSS · papan world_boss",skill:"Galaxy Roar",mod:"GRAVITY SURGE",
     art:"../assets/raid/eternal-dragon-hd.webp",pc:"var(--cyan)"},
  b:{name:"SHADOW KING",tag:"EX · WORLD BOSS · papan world_boss_b",skill:"Umbra Eclipse",mod:"SHADOW TIDE",
     art:"../assets/cards/art/shadow-king.webp",pc:"var(--violet)"}
};
const DECK=["ant-king","almighty-tyrant","astral-devourer","crimson-warlord"];
/* state mock: hp_left 6.2B => 3.8B hilang => 3 fase jebol penuh, fase 4 sebagian */
let hpLeft=6.2e9;
const PHASES=5;
function fmtBig(n){n=Math.round(Number(n)||0);if(n<1000)return String(n);
  const u=[[1e12,"T"],[1e9,"B"],[1e6,"M"],[1e3,"K"]];for(const[v,s]of u)if(n>=v){const x=n/v;return (x<10?(Math.round(x*10)/10):Math.floor(x))+s;}return String(n);}
function titleCase(s){return s.split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');}

const REWARDS=[
  {mask:'../assets/icons/gems.svg',c:'var(--cyan)',lab:'GEM'},
  {mask:'../assets/icons/coins.svg',c:'var(--gold)',lab:'TOKEN'},
  {mask:'../assets/icons/gems.svg',c:'var(--cyan)',lab:'GEM'},
  {mask:'../assets/icons/card-draw.svg',c:'var(--crimson)',lab:'PACK'},
  {mask:'../assets/icons/crown.svg',c:'var(--violet)',lab:'TITLE'}
];
function drawMilestones(){
  const el=document.getElementById('milestones'); if(!el)return;
  const per=WB_POOL_HP/PHASES, broken=WB_POOL_HP-hpLeft;
  const pct=Math.min(Math.max(broken/WB_POOL_HP,0),1)*100;
  const cur=Math.min(PHASES,Math.floor(broken/per)+1);
  let html='<div class="gfill" style="height:'+pct.toFixed(1)+'%"></div>';
  for(let k=1;k<10;k++){const isM=k%2===0;html+='<i class="gtick'+(isM?'':' minor')+'" style="bottom:'+(k*10)+'%"></i>';}
  html+='<i class="gmark" style="bottom:'+pct.toFixed(1)+'%"></i><span class="gph" style="bottom:calc('+pct.toFixed(1)+'% + 4px)">F'+cur+'</span>';
  REWARDS.forEach((r,i)=>{
    const st=broken>=(i+1)*per?'broken':'';
    html+=`<span class="gnode ${st}" data-i="${i}" style="bottom:${(i*100/PHASES).toFixed(2)}%;--im:url('${r.mask}');--ic:${r.c};--ring:${r.c}"><span class="gi"></span></span>`;
  });
  el.innerHTML=html;
  document.getElementById('hpLeft').textContent=fmtBig(hpLeft);
  document.getElementById('hpPool').textContent=fmtBig(WB_POOL_HP);
}
function drawDeck(){
  const ROLES=['lead','mid','sup','res'];
  document.getElementById('deck').innerHTML=DECK.map((s,i)=>
    `<div class="slot ${ROLES[i]||'res'}"><img src="../assets/cards/thumb/${s}.webp" alt=""><div class="r">${titleCase(s)}</div></div>`).join('');
}
function drawCrystals(){
  const left=2; // mock: 1 terpakai
  document.getElementById('crystals').innerHTML=[0,1,2].map(i=>
    `<span class="cr ${i<left?'on':'off'}"></span>`).join('');
}
let curBoss='a';
function drawRail(){
  const el=document.getElementById('rail'); if(!el)return;
  const per=WB_POOL_HP/PHASES, broken=WB_POOL_HP-hpLeft;
  let html='<div class="rh">REWARD FASE</div>';
  REWARDS.forEach((r,i)=>{
    const pct=Math.min(Math.max(broken-i*per,0),per)/per*100;
    const st=pct>=100?'done':(pct>0?'cur':'lock');
    const lab=st==='done'?'JEBOL':(st==='cur'?'JALAN':'BELUM');
    html+=`<div class="rrow ${st}"><span class="ric" style="--im:url('${r.mask}');--ic:${r.c}"></span><span class="rlb">${r.lab}</span><span class="rph">F${i+1}</span><span class="rst">${lab}</span></div>`;
  });
  el.innerHTML=html;
}
function drawCodes(){const broken=WB_POOL_HP-hpLeft;const pct=Math.min(Math.max(broken/WB_POOL_HP,0),1)*100;const per=WB_POOL_HP/PHASES;const cur=Math.min(PHASES,Math.floor(broken/per)+1);const set=(id,txt)=>{const e=document.getElementById(id);if(e)e.textContent=txt;};set('codeCol','WB//'+(curBoss==='a'?'01':'02'));set('codeRail','PHASE '+cur+'/'+PHASES);}
function applyBoss(){
  const b=BOSSES[curBoss];
  const _bi=document.getElementById('bossImg');_bi.src=b.art;
  const _setAR=()=>{const ba=document.querySelector('.bossart');if(ba&&_bi.naturalWidth)ba.style.setProperty('--ar',(Math.round(_bi.naturalWidth/_bi.naturalHeight*1000)/1000));};_bi.onload=_setAR;if(_bi.complete)_setAR();
  document.getElementById('bossImg').alt=b.name;
  document.getElementById('bossName').textContent=b.name;
  document.getElementById('bossSkill').textContent=b.skill;
  drawMilestones();
  drawRail();
  drawCodes();
}
function glitch(){const ba=document.querySelector('.bossart');if(!ba)return;ba.classList.add('glitch');setTimeout(()=>ba.classList.remove('glitch'),150);}
document.getElementById('bsw').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-b]');if(!btn||btn.dataset.b===curBoss)return;curBoss=btn.dataset.b;
  [].slice.call(document.querySelectorAll('#bsw button')).forEach(x=>x.classList.toggle('on',x===btn));
  applyBoss();glitch();
});
drawDeck();drawCrystals();applyBoss();
window.__setBoss=k=>{if(BOSSES[k]&&k!==curBoss){curBoss=k;[].slice.call(document.querySelectorAll('#bsw button')).forEach(x=>x.classList.toggle('on',x.dataset.b===k));applyBoss();glitch();}};

/* ===== T22: modal papan peringkat (buka dari tombol header; X/backdrop/ESC tutup) ===== */
(function(){
  const m=document.getElementById('lbModal'), open=document.getElementById('lbBtn'), close=document.getElementById('lbClose');
  if(!m||!open)return;
  const show=()=>{m.classList.add('show');m.setAttribute('aria-hidden','false');};
  const hide=()=>{m.classList.remove('show');m.setAttribute('aria-hidden','true');};
  open.addEventListener('click',show);
  close.addEventListener('click',hide);
  m.addEventListener('click',e=>{if(e.target===m)hide();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&m.classList.contains('show'))hide();});
  window.__lbOpen=show;window.__lbClose=hide; // hook harness
})();

/* ===== PENGHITUNG TEKS terlihat (gate T18) + mode dev ===== */
function teksCount(){
  let n=0;
  const skip='.slot .r,.frow .dm,.frow .tm,.devonly,.mockcorner';
  const vis=el=>{const s=getComputedStyle(el);return s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0';};
  ['.stage','.feed','.dock'].forEach(sel=>{const z=document.querySelector(sel);if(!z||!vis(z))return;
    (function walk(el){
      if(!vis(el))return;
      if(el.matches(skip))return;
      el.childNodes.forEach(nd=>{
        if(nd.nodeType===3)n+=(nd.textContent||'').replace(/\s+/g,'').length;
        else if(nd.nodeType===1)walk(nd);
      });
    })(z);
  });
  return n;
}
if(new URLSearchParams(location.search).get('dev')==='1'){
  document.body.classList.add('dev');
  const rows=[
    {n:'RYU-KEN',d:9.8e9,t:'ant-king'},
    {n:'SHADOW KING',d:8.1e9,t:'shadow-king'},
    {n:'VOID WALKER',d:7.4e9,t:'astral-devourer'},
    {n:'KAMU',d:6.9e9,t:'crimson-warlord',you:true},
    {n:'AEGIS',d:5.2e9,t:'almighty-tyrant'},
    {n:'PYRA',d:4.1e9,t:'ant-king'}
  ];
  const max=rows[0].d;
  const podium=document.getElementById('rkPodium');
  if(podium){
    const rkOf=r=>rows.indexOf(r)+1;
    podium.innerHTML=[rows[1],rows[0],rows[2]].map(r=>{
      const rk=rkOf(r);
      const ring=rk===1?'<span class="pod-ring pod-gold"></span>':'<img class="pod-ring" src="../assets/ui/lb-ring.png" alt="">';
      return '<div class="pod pod'+rk+'">'+
        '<div class="pod-top">'+ring+
        '<span class="pod-av"><img src="../assets/cards/thumb/'+r.t+'.webp" alt=""></span>'+
        '<span class="pod-rk">'+rk+'</span></div>'+
        '<div class="pod-plate"><span class="pod-nm">'+r.n+'</span><span class="pod-val">'+fmtBig(r.d)+'</span></div></div>';
    }).join('');
  }
  const list=document.querySelector('.lb-list');
  if(list){
    list.innerHTML=rows.map((r,i)=>
      '<div class="frow'+(r.you?' lb-kamu':'')+'"><span class="dmbar" style="width:'+Math.round(r.d/max*100)+'%"></span>'+
      '<span class="rk">'+(i+1)+'</span><span class="av"><img src="../assets/cards/thumb/'+r.t+'.webp" alt=""></span>'+
      '<span class="nm">'+r.n+'</span><span class="dm">'+fmtBig(r.d)+'</span>'+
      (r.you?'<span class="tm mocktag">MOCK</span>':'')+'</div>').join('');
    const yp=document.querySelector('.lb-you .ypos b'); if(yp)yp.textContent='4';
    const yd=document.querySelector('.lb-you .yd'); if(yd)yd.textContent='Δ +2';
  }
}
/* chip papan aktif (2 boss = 2 papan, dari data) — toggle visual */
(function(){const b=document.getElementById('lbBoards');if(!b)return;
  b.addEventListener('click',e=>{const btn=e.target.closest('.lbb');if(!btn)return;
    [].slice.call(b.querySelectorAll('.lbb')).forEach(x=>x.classList.toggle('on',x===btn));});})();

/* ===== GERBANG ASET: hitung <img> + URL ikon CSS-mask (naturalWidth>0). m HARUS 0 ===== */
function maskUrls(){
  const set=new Set();
  [].slice.call(document.querySelectorAll('[style*="--im"]')).forEach(el=>{
    const m=(el.style.getPropertyValue('--im')||'').match(/url\(['"]?([^'")]+)['"]?\)/);if(m)set.add(m[1]);});
  ['../assets/icons/crossed-swords.svg','../assets/icons/check-mark.svg'].forEach(u=>set.add(u));
  return [...set];
}
const PRE={};
function ensurePre(){maskUrls().forEach(u=>{if(!PRE[u]){const im=new Image();im.onload=recountAssets;im.onerror=recountAssets;im.src=u;PRE[u]=im;}});}
function recountAssets(){
  ensurePre();let loaded=0,failed=0;const failedSrcs=[];
  const check=(el,src)=>{if(el.complete&&el.naturalWidth>0)loaded++;else{failed++;if(failedSrcs.length<8)failedSrcs.push(src);}};
  [].slice.call(document.images).forEach(im=>check(im,im.getAttribute('src')));
  Object.keys(PRE).forEach(u=>check(PRE[u],u));
  const total=document.images.length+Object.keys(PRE).length;
  const el=document.getElementById('assetgate');
  if(el){el.textContent='ASET: '+loaded+' dimuat, '+failed+' gagal · TEKS '+teksCount();el.className='gate '+(failed===0?'ok':'bad');}
  window.__assetGate={loaded,failed,total,failedSrcs};
}
[].slice.call(document.images).forEach(im=>{im.addEventListener('load',recountAssets);im.addEventListener('error',recountAssets);});
window.addEventListener('load',recountAssets);
recountAssets();setTimeout(recountAssets,700);setTimeout(recountAssets,1500);
</script>
</body></html>
