<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTIPE — Animasi Serangan</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/anim-prototipe.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:radial-gradient(ellipse at top,#141a33,#090b16 70%);color:#e8ecff;font-family:Outfit,sans-serif;padding:24px;display:flex;flex-direction:column;align-items:center;gap:18px}
  h1{font-family:'Barlow Condensed',sans-serif;font-size:30px;letter-spacing:.18em;color:#8fd8ff}
  h1 span{font-size:13px;letter-spacing:.3em;color:#5a6690;display:block;text-align:center;font-family:Outfit}
  .arena{display:flex;align-items:center;justify-content:center;gap:min(9vw,110px);margin-top:10px;min-height:300px}
  .fighter{position:relative;width:150px;aspect-ratio:3/4;border-radius:20px;border:2px solid rgba(255,255,255,.35);background-size:cover;background-position:center top;background-color:#1b2242;box-shadow:0 10px 30px rgba(0,0,0,.55);transition:filter .2s}
  .fighter .nm{position:absolute;left:0;right:0;bottom:0;padding:6px 4px;font-size:12px;font-weight:700;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.85));border-radius:0 0 18px 18px}
  .vs{font-family:'Barlow Condensed';font-size:38px;font-weight:800;color:#ffb45e;text-shadow:0 0 14px rgba(255,140,0,.6)}
  .ctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:860px}
  .ctrl button{font-family:Outfit;font-weight:700;font-size:13px;padding:9px 15px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#e8ecff;cursor:pointer;transition:transform .12s,background .12s}
  .ctrl button:hover{transform:translateY(-2px);background:rgba(255,255,255,.16)}
  .ctrl .grp{display:flex;gap:6px;align-items:center;padding:6px 10px;border:1px dashed rgba(140,170,255,.35);border-radius:12px}
  .ctrl .grp b{font-size:11px;letter-spacing:.15em;color:#8fa3e0}
  .ctrl .st{color:#ffe066}.ctrl .fr{color:#8ecbff}.ctrl .bu{color:#ff9b6a}.ctrl .ci{color:#c9a7ff}
  .ctrl .lyr{opacity:.5;border-style:dashed}.ctrl .lyr.on{opacity:1;border-style:solid;background:rgba(140,210,255,.18);border-color:#8ecbff;color:#cfe9ff}
  .log{font-size:12px;color:#6d78a8;height:16px}
  .arena{position:relative}
  .fw{position:relative}
  .tune label{display:flex;align-items:center;gap:5px;font-size:11px;color:#8fa3e0;cursor:pointer}
  .tune input[type=range]{width:86px;accent-color:#8ecbff}
  .tune i{font-style:normal;font-weight:800;color:#e8ecff;min-width:24px;text-align:right}
  #framebar{position:relative;width:340px;max-width:90vw;height:13px;display:flex;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);opacity:.4;transition:opacity .2s}
  #framebar.run{opacity:1}
  #framebar i{height:100%;transition:filter .1s}
  #framebar i:nth-child(1){background:#5a8cff}
  #framebar i:nth-child(2){background:#ff5c5c}
  #framebar i:nth-child(3){background:#3ecf8e}
  #framebar i.act{filter:brightness(1.9)}
  #framebar b{position:absolute;top:0;bottom:0;left:0;width:2px;background:#fff;box-shadow:0 0 6px #fff}
  #combo{position:absolute;top:2px;right:-4px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
  #combo.on{opacity:1}
  #combo b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:800;color:#ffd166;text-shadow:0 0 14px rgba(255,180,60,.75);line-height:1}
  #combo b.pop{animation:comboPop .3s cubic-bezier(.2,1.6,.4,1)}
  #combo small{font-size:9px;letter-spacing:.32em;color:#ffb45e}
  @keyframes comboPop{0%{transform:scale(1.8)}55%{transform:scale(.9)}100%{transform:scale(1)}}
</style>
</head>
<body>
<h1>ANIMASI SERANGAN — PROTOTIPE<span>halaman demo mandiri, gak nyambung ke game</span></h1>

<div class="arena">
  <div class="fw"><div id="demoMe" class="fighter" style="background-image:url('assets/cards/art/ex-gojo.png')"><span class="nm">PEMAIN (me)</span><div class="hpmock" data-cur="1000" data-max="1000"><span class="hp-track"><i class="hp-fill"></i></span><b class="hp-num">1000/1000</b></div></div></div>
  <div class="vs">VS</div>
  <div class="fw"><div id="demoFoe" class="fighter" style="background-image:url('assets/cards/art/absolute-zero.jpg')"><span class="nm">MUSUH (foe)</span><div class="hpmock" data-cur="1000" data-max="1000"><span class="hp-track"><i class="hp-fill"></i></span><b class="hp-num">1000/1000</b></div></div></div>
  <div id="combo"><b>×2</b><small>COMBO</small></div>
</div>

<div class="ctrl">
  <div class="grp"><b>TARGET</b>
    <button id="btnSide">▸ kiri (me)</button>
  </div>
  <div class="grp"><b>STATUS</b>
    <button class="st" data-status="stun">⚡ STUN</button>
    <button class="fr" data-status="freeze">❄ FREEZE</button>
    <button class="bu" data-status="burn">🔥 IGNITE</button>

    <button class="bu" id="btnTick">🔥 TICK −120</button>
  </div>
  <div class="grp"><b>CUT-IN</b>
    <button class="ci" data-cut="THE WORLD" data-side="foe" data-kind="time">THE WORLD</button>
    <button class="ci" data-cut="UNLIMITED VOID" data-side="me" data-kind="time">UNLIMITED VOID</button>
    <button class="ci" data-cut="SUPERNOVA" data-side="foe" data-kind="burst">SUPERNOVA</button>
    <button class="ci" data-cut="DOMAIN EXPANSION" data-side="me" data-kind="hex">DOMAIN EXPANSION</button>
    <button class="ci" data-cut="HAKAI" data-side="foe" data-kind="burst">HAKAI</button>
    <button class="ci" data-cut="NINE CIRCLES" data-side="me" data-kind="strike">NINE CIRCLES</button>
  </div>
  <div class="grp"><b>SERANGAN</b>
    <button data-atk="lunge">👊 LUNGE</button>
    <button data-atk="wind">↩ WINDUP</button>
    <button data-atk="hit">💥 HIT/SHAKE</button>
    <button data-atk="impact">✨ IMPACT</button>
    <button data-atk="shake">📳 SHAKE</button>
    <button data-atk="shakeBig">📳 SHAKE BIG</button>
    <button data-atk="stop">⏸ HITSTOP</button>
    <button data-atk="float">🔢 DAMAGE FLOAT</button>
    <button data-atk="full" style="color:#9dffc0">▶ SERANGAN LAMA LENGKAP</button>
  </div>
  <div class="grp"><b>SFX</b>
    <button data-sfx="hit">🔊 hit</button>
    <button data-sfx="crit">🔊 crit</button>
    <button data-sfx="dodge">🔊 dodge</button>
    <button data-sfx="win">🔊 win</button>
    <button data-sfx="lose">🔊 lose</button>
  </div>
  <div class="grp"><b>URUTAN</b>
    <button id="btnAll" style="color:#9dffc0">▶ DEMO SEMUA</button>
    <button id="btnOff">ANIM_FX: ON</button>
  </div>
</div>
<div class="grp"><b>FEEL LAB</b>
    <button class="lyr on" data-layer="windup">windup</button>
    <button class="lyr on" data-layer="trail">trail</button>
    <button class="lyr on" data-layer="impact">impact</button>
    <button class="lyr on" data-layer="settle">settle</button>
    <button id="btnFire">▶ SERANG</button>
    <button id="btnFireCrit">▶ CRIT</button>
  </div>
    <div class="grp" style="flex-wrap:wrap"><b>SHEET FX</b>
    <button data-sheet="white_slash">&#9876; SLASH</button>
    <button data-sheet="gold_crit" class="st">&#10022; CRIT</button>
    <button data-sheet="white_hit">&#128165; HIT</button>
    <button data-sheet="white_spark">&#10024; SPARK</button>
    <button data-sheet="fire_impact" class="bu">&#128293; FIRE</button>
    <button data-sheet="ice_impact" class="fr">&#129526; ICE</button>
    <button data-sheet="ice_bolt" class="fr">&#129526; BOLT</button>
  </div>
  <div class="grp tune"><b>TUNE</b>
    <label>hitstop<input type="range" data-feel="hitstop" min="0" max="200" step="5"><i data-v="hitstop">90</i>ms</label>
    <label>trauma<input type="range" data-feel="trauma" min="0" max="1" step="0.05"><i data-v="trauma">0.6</i></label>
    <label>knock<input type="range" data-feel="knock" min="0" max="60" step="2"><i data-v="knock">26</i>px</label>
  </div>
  <div class="grp"><b>PRESET</b>
    <button data-preset="ARCADE">🎰 ARCADE</button>
    <button data-preset="SUBTLE">🍃 SUBTLE</button>
    <button data-preset="HEAVY">🪨 HEAVY</button>
    <button data-preset="SNAPPY">⚡ SNAPPY</button>
    <button id="btnSlo">SLO-MO: OFF</button>
    <button id="btnAB" style="color:#9dffc0">⚖ A/B SIDE-BY-SIDE</button>
    <button id="btnCfg">📋 SALIN CONFIG</button>
  </div>
  <div id="framebar" title="startup (biru) · active (merah) · recovery (hijau)"><i></i><i></i><i></i><b></b></div>
  <div class="log" id="log">klik tombol buat jalanin animasi</div>
  <div class="cred">Spritesheet: <b>Combat FX Free by heyheythere</b> — <a href="https://heyheythere.itch.io/combat-fx-free" target="_blank">itch.io</a> — CC BY 4.0</div>

<script src="js/anim-prototipe.js"></script>
<script>
ANIM_FX.demoArt={me:"assets/cards/art/ex-gojo.png",foe:"assets/cards/art/absolute-zero.jpg"};
var side="me";
function sel(){return side==="me"?"#demoMe":"#demoFoe";}
function say(t){document.getElementById("log").textContent=t;}
document.getElementById("btnSide").onclick=function(){
  side=(side==="me")?"foe":"me";
  this.textContent="▸ "+(side==="me"?"kiri (me)":"kanan (foe)");
  say("target status → "+side);
};
document.querySelectorAll("[data-status]").forEach(function(b){
  b.onclick=function(){
    ANIM_FX.statusFx(sel(),b.getAttribute("data-status"));
    say("statusFx("+sel()+", "+b.getAttribute("data-status")+")");
  };
});
document.querySelectorAll("[data-sheet]").forEach(function(b){
  b.onclick=function(){
    if(!ANIM_FX.enabled){say("ANIM_FX lagi OFF - nyalain dulu");return;}
    var el=document.querySelector(sel());if(!el)return;
    var r=el.getBoundingClientRect(),n=b.getAttribute("data-sheet");
    var h=ANIM_FX.sheetFx(n,r.left+r.width/2,r.top+r.height/2,{size:200});
    if(h)setTimeout(function(){h.stop();},1800); /* bolt loop - auto berhenti */
    say('sheetFx("'+n+'") -> '+sel());
  };
});document.querySelectorAll("[data-cut]").forEach(function(b){
  b.onclick=function(){
    var nm=b.getAttribute("data-cut"),sd=b.getAttribute("data-side"),kd=b.getAttribute("data-kind")||"strike";
    ANIM_FX.skillCutIn(nm,sd,kd);
    say("skillCutIn("+nm+", "+sd+")");
  };
});
/* penyerang = kartu lawan dari target (side) */
function atkSel(){return sel()==="#demoMe"?"#demoFoe":"#demoMe";}
document.querySelectorAll("[data-atk]").forEach(function(b){
  b.onclick=function(){
    if(!ANIM_FX.enabled){say("ANIM_FX lagi OFF — nyalain dulu");return;}
    var k=b.getAttribute("data-atk"),a=atkSel(),d=sel();
    if(k==="lunge"){ANIM_FX.attackLunge(a,false);say("lunge → penyerang "+a);}
    else if(k==="wind"){ANIM_FX.attackLunge(a,true);say("windlunge → penyerang "+a);}
    else if(k==="hit"){ANIM_FX.pulse(d,"hit");say("hitShake → target "+d);}
    else if(k==="impact"){ANIM_FX.impactFx(d,false);say("impactFx → target "+d);}
    else if(k==="shake"){ANIM_FX.shakeScreen(false);say("shakeScreen (small)");}
    else if(k==="shakeBig"){ANIM_FX.shakeScreen(true);say("shakeScreen (BIG)");}
    else if(k==="stop"){ANIM_FX.hitStop(90);say("hitStop 90ms");}
    else if(k==="float"){ANIM_FX.dmgFloat(d,"47",null);say("damage float → target "+d);}
    else if(k==="full"){ANIM_FX.attackOld(a,d,{wind:true,txt:"47"});say("▶ serangan lama lengkap: "+a+" → "+d);}
  };
});
document.querySelectorAll("[data-sfx]").forEach(function(b){
  b.onclick=function(){var k=b.getAttribute("data-sfx");ANIM_FX.sfx[k]();say("sfx."+k+"()");};
});
document.getElementById("btnAll").onclick=function(){
  if(!ANIM_FX.enabled){say("ANIM_FX lagi OFF — nyalain dulu");return;}
  var seq=[
    function(){ANIM_FX.attackNew("#demoFoe","#demoMe",{txt:"47"});say("1/6 · attackNew normal (47) — pipeline penuh");},
    function(){ANIM_FX.attackNew("#demoFoe","#demoMe",{txt:"312",big:true});say("2/6 · attackNew CRIT (312)");},
    function(){ANIM_FX.statusFx("#demoMe","burn");say("3/6 · BURN ignite → kartu pemain");},
    function(){ANIM_FX.burnTick("#demoMe","120");say("4/6 · BURN tick −120 (ledakan api fire_impact sheet)");},
    function(){ANIM_FX.skillCutIn("UNLIMITED VOID","me","time");say("5/6 · cut-in FULL UNLIMITED VOID");},
    function(){ANIM_FX.skillCutIn("THE WORLD","foe","time");say("6/6 · jurus ke-2 < 3 dtk → otomatis jadi MINI banner (queue)");}
  ];
  var i=0;(function step(){if(i>=seq.length)return;seq[i++]();setTimeout(step,1500);})();
};
/* ---------- FEEL LAB wiring ---------- */
document.querySelectorAll("[data-layer]").forEach(function(b){
  b.onclick=function(){
    var k=b.getAttribute("data-layer");
    ANIM_FX.layers[k]=!ANIM_FX.layers[k];
    b.classList.toggle("on",ANIM_FX.layers[k]);
    say("layer "+k+": "+(ANIM_FX.layers[k]?"ON":"OFF"));
  };
});
document.getElementById("btnFire").onclick=function(){
  if(!ANIM_FX.enabled){say("ANIM_FX lagi OFF — nyalain dulu");return;}
  ANIM_FX.attackNew(atkSel(),sel(),{txt:"47"});
  say("▶ attackNew "+atkSel()+" → "+sel()+" (47)");
};
document.getElementById("btnFireCrit").onclick=function(){
  if(!ANIM_FX.enabled){say("ANIM_FX lagi OFF — nyalain dulu");return;}
  ANIM_FX.attackNew(atkSel(),sel(),{txt:"312",big:true});
  say("▶ attackNew "+atkSel()+" → "+sel()+" (CRIT 312)");
};
document.getElementById("btnTick").onclick=function(){
  ANIM_FX.burnTick(sel(),"120");
  say("burnTick → "+sel()+" −120");
};
/* ---------- FEEL LAB v2 wiring ---------- */
function syncFeelUI(){
  document.querySelectorAll("[data-feel]").forEach(function(s){
    var k=s.getAttribute("data-feel");s.value=ANIM_FX.FEEL[k];
    var lab=document.querySelector('[data-v="'+k+'"]');if(lab)lab.textContent=ANIM_FX.FEEL[k];
  });
}
document.querySelectorAll("[data-feel]").forEach(function(s){
  s.addEventListener("input",function(){
    var k=s.getAttribute("data-feel"),v=parseFloat(s.value);
    ANIM_FX.FEEL[k]=v;
    if(k==="hitstop")ANIM_FX.FEEL.critHitstop=Math.round(v*1.55);
    var lab=document.querySelector('[data-v="'+k+'"]');if(lab)lab.textContent=v;
    say("FEEL."+k+" = "+v);
  });
});
document.querySelectorAll("[data-preset]").forEach(function(b){
  b.onclick=function(){
    var n=b.getAttribute("data-preset");
    if(ANIM_FX.applyPreset(n)){syncFeelUI();say("preset "+n+" → hitstop "+ANIM_FX.FEEL.hitstop+"ms · trauma "+ANIM_FX.FEEL.trauma+" · knock "+ANIM_FX.FEEL.knock+"px");}
  };
});
syncFeelUI();
document.getElementById("btnSlo").onclick=function(){
  ANIM_FX.FEEL.sloMo=!ANIM_FX.FEEL.sloMo;
  this.textContent="SLO-MO: "+(ANIM_FX.FEEL.sloMo?"ON":"OFF");
  say("slo-mo hitstop "+(ANIM_FX.FEEL.sloMo?"ON — semua animasi melambat pas freeze":"OFF"));
};
document.getElementById("btnAB").onclick=function(){
  if(!ANIM_FX.enabled){say("ANIM_FX lagi OFF — nyalain dulu");return;}
  ANIM_FX.attackOld("#demoFoe","#demoMe",{wind:true,txt:"47"});
  ANIM_FX.attackNew("#demoMe","#demoFoe",{txt:"47"});
  say("⚖ kiri kena serangan LAMA, kanan kena serangan BARU — bandingin barengan");
};
document.getElementById("btnCfg").onclick=function(){
  var t=ANIM_FX.exportConfig();
  try{navigator.clipboard.writeText(t).then(function(){say("disalin → "+t);},function(){say(t);});}catch(e){say(t);}
};

</script>
</body>
</html>
