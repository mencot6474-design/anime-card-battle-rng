<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 640" width="1600" height="640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Eternal Dragon raid banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#080610"/>
      <stop offset="40%" stop-color="#160b26"/>
      <stop offset="72%" stop-color="#3a1140"/>
      <stop offset="100%" stop-color="#6e0b22"/>
    </linearGradient>
    <radialGradient id="neb1" cx="78%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#ff5a5f" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#8E0B22" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#8E0B22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="46%" cy="30%" r="42%">
      <stop offset="0%" stop-color="#7a3ff0" stop-opacity=".4"/>
      <stop offset="60%" stop-color="#3a1c6e" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#3a1c6e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9aa0" stop-opacity=".9"/>
      <stop offset="45%" stop-color="#8E0B22" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#8E0B22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0575f"/>
      <stop offset="45%" stop-color="#8E0B22"/>
      <stop offset="100%" stop-color="#22060f"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a1338"/>
      <stop offset="60%" stop-color="#2a0a1a"/>
      <stop offset="100%" stop-color="#180622"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e7d6b6"/><stop offset="100%" stop-color="#6a5844"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#ffe0ee"/><stop offset="100%" stop-color="#B98CFF"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B98CFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff5a5f" stop-opacity=".7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <g id="half">
      <path fill="url(#wing)" stroke="#B98CFF" stroke-opacity=".5" stroke-width="1.4"
        d="M184,168 C150,148 120,150 90,116 C104,150 96,160 60,150 C90,178 92,188 54,200 C96,206 116,210 136,250 C158,208 172,198 192,198 Z"/>
      <path fill="url(#horn)" stroke="#1a0810" stroke-width="1" d="M168,128 L150,96 L130,72 L120,42 L140,66 L154,92 L178,118 Z"/>
      <path fill="url(#eye)" filter="url(#glow)" d="M156,164 L182,158 L188,170 L164,176 Z"/>
    </g>
    <g id="crest">
      <use xlink:href="#half"/>
      <use xlink:href="#half" transform="matrix(-1 0 0 1 400 0)"/>
      <path fill="url(#body)" stroke="#B98CFF" stroke-opacity=".55" stroke-width="1.6" filter="url(#glow)"
        d="M200,120 L232,128 L258,150 L266,178 L250,196 L258,224 L232,220 L214,246 L206,236 L200,252 L194,236 L186,246 L168,220 L142,224 L150,196 L134,178 L142,150 L168,128 Z"/>
      <path d="M200,126 L200,246" stroke="#B98CFF" stroke-opacity=".5" stroke-width="1.4"/>
      <path fill="#ffe0ee" opacity=".95" filter="url(#glow)" d="M192,214 L200,230 L208,214 L200,208 Z"/>
      <circle cx="192" cy="238" r="2.4" fill="#2a0810"/><circle cx="208" cy="238" r="2.4" fill="#2a0810"/>
    </g>
  </defs>

  <rect width="1600" height="640" fill="url(#sky)"/>
  <rect width="1600" height="640" fill="url(#neb2)"/>
  <rect width="1600" height="640" fill="url(#neb1)"/>

  <g fill="#ffffff">
    <circle cx="120" cy="90" r="1.6" opacity=".9"/><circle cx="220" cy="160" r="1.2" opacity=".6"/>
    <circle cx="320" cy="70" r="1.8" opacity=".8"/><circle cx="420" cy="140" r="1.1" opacity=".5"/>
    <circle cx="180" cy="300" r="1.3" opacity=".6"/><circle cx="90" cy="420" r="1.5" opacity=".7"/>
    <circle cx="360" cy="360" r="1.1" opacity=".5"/><circle cx="520" cy="90" r="1.4" opacity=".7"/>
    <circle cx="600" cy="220" r="1.2" opacity=".5"/><circle cx="680" cy="120" r="1.7" opacity=".85"/>
    <circle cx="250" cy="500" r="1.2" opacity=".5"/><circle cx="480" cy="470" r="1.4" opacity=".6"/>
    <circle cx="760" cy="320" r="1.2" opacity=".55"/><circle cx="140" cy="200" r="1" opacity=".5"/>
    <circle cx="560" cy="540" r="1.2" opacity=".5"/><circle cx="300" cy="250" r="1" opacity=".45"/>
    <circle cx="640" cy="440" r="1.3" opacity=".5"/><circle cx="440" cy="300" r="1" opacity=".4"/>
    <path d="M150,120 l2,5 5,2 -5,2 -2,5 -2,-5 -5,-2 5,-2 z" opacity=".9"/>
    <path d="M430,120 l2,5 5,2 -5,2 -2,5 -2,-5 -5,-2 5,-2 z" opacity=".8"/>
    <path d="M700,220 l2,5 5,2 -5,2 -2,5 -2,-5 -5,-2 5,-2 z" opacity=".85"/>
  </g>

  <path d="M0,470 Q400,430 820,470 T1600,450 L1600,640 L0,640 Z" fill="#0a0510" opacity=".55"/>
  <path d="M760,300 L1600,120 L1600,220 Z" fill="url(#beam)" opacity=".5" filter="url(#blur)"/>
  <path d="M760,340 L1600,520 L1600,420 Z" fill="url(#beam)" opacity=".5" filter="url(#blur)"/>

  <ellipse cx="1250" cy="312" rx="360" ry="300" fill="url(#disc)" filter="url(#blur)" opacity=".8"/>
  <g transform="translate(858,-46) scale(1.98)">
    <use xlink:href="#crest"/>
  </g>
</svg>
