<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 460" fill="none">
  <defs>
    <linearGradient id="holoFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.9)"/>
      <stop offset="50%" stop-color="rgba(192, 132, 252, 0.4)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.9)"/>
    </linearGradient>
  </defs>

  <!-- Thin Precision Chamfered Glass Border -->
  <path d="M20 2 L290 2 L308 20 L308 440 L290 458 L20 458 L2 440 L2 20 Z" 
        stroke="url(#holoFade)" stroke-width="1.5" fill="none"/>

  <!-- High-Precision HUD Bracket Corners -->
  <!-- Top-Left Bracket [ -->
  <path d="M2 30 L2 20 L20 2 L30 2" stroke="#fff" stroke-width="2.5" fill="none"/>
  <rect x="6" y="6" width="3" height="3" fill="#38bdf8"/>
  <line x1="36" y1="2" x2="50" y2="2" stroke="#38bdf8" stroke-width="2"/>
  <line x1="2" y1="36" x2="2" y2="50" stroke="#38bdf8" stroke-width="2"/>

  <!-- Top-Right Bracket ] -->
  <path d="M308 30 L308 20 L290 2 L280 2" stroke="#fff" stroke-width="2.5" fill="none"/>
  <rect x="301" y="6" width="3" height="3" fill="#38bdf8"/>
  <line x1="274" y1="2" x2="260" y2="2" stroke="#38bdf8" stroke-width="2"/>
  <line x1="308" y1="36" x2="308" y2="50" stroke="#38bdf8" stroke-width="2"/>

  <!-- Bottom-Left Bracket [ -->
  <path d="M2 430 L2 440 L20 458 L30 458" stroke="#fff" stroke-width="2.5" fill="none"/>
  <rect x="6" y="451" width="3" height="3" fill="#38bdf8"/>

  <!-- Bottom-Right Bracket ] -->
  <path d="M308 430 L308 440 L290 458 L280 458" stroke="#fff" stroke-width="2.5" fill="none"/>
  <rect x="301" y="451" width="3" height="3" fill="#38bdf8"/>

  <!-- Target Crosshairs on Sides -->
  <g stroke="#38bdf8" stroke-width="1">
    <!-- Left Target -->
    <circle cx="2" cy="230" r="6" fill="none"/>
    <line x1="2" y1="220" x2="2" y2="240"/>
    <line x1="-4" y1="230" x2="8" y2="230"/>
    <!-- Right Target -->
    <circle cx="308" cy="230" r="6" fill="none"/>
    <line x1="308" y1="220" x2="308" y2="240"/>
    <line x1="302" y1="230" x2="314" y2="230"/>
  </g>

  <!-- Top Center Telemetry Tag -->
  <g transform="translate(155, 12)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="2">NEURAL SYNC: 98.4%</text>
  </g>
