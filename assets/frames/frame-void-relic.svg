<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 460" fill="none">
  <defs>
    <linearGradient id="voidGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <filter id="voidPurpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Gothic Jagged Bevel Outer Path -->
  <path d="M36 2 L130 2 L155 12 L180 2 L274 2 L308 36 L308 200 L298 230 L308 260 L308 424 L274 458 L180 458 L155 448 L130 458 L36 458 L2 424 L2 260 L12 230 L2 200 L2 36 Z" 
        stroke="url(#voidGradient)" stroke-width="3" fill="none" filter="url(#voidPurpGlow)"/>

  <!-- Inner Ethereal Vein Line -->
  <path d="M40 10 L132 10 L155 19 L178 10 L270 10 L300 40 L300 420 L270 450 L178 450 L155 441 L132 450 L40 450 L10 420 L10 40 Z" 
        stroke="rgba(216, 180, 254, 0.45)" stroke-width="1.2" stroke-dasharray="14 4" fill="none"/>

  <!-- Top Dark Sovereign Horns -->
  <g transform="translate(155, 0)">
    <!-- Horn Left -->
    <path d="M-10 14 L-25 -6 L-18 16 Z" fill="#c084fc"/>
    <path d="M-25 -6 L-45 -14 L-32 10 Z" fill="#9333ea"/>
    <!-- Horn Right -->
    <path d="M10 14 L25 -6 L18 16 Z" fill="#c084fc"/>
    <path d="M25 -6 L45 -14 L32 10 Z" fill="#9333ea"/>
    <!-- Central Ethereal Eye -->
    <circle cx="0" cy="14" r="5" fill="#f43f5e" filter="drop-shadow(0 0 6px #f43f5e)"/>
    <circle cx="0" cy="14" r="2" fill="#fff"/>
  </g>

  <!-- 4 Sharp Gothic Claws Corners -->
  <!-- Top Left -->
  <g>
    <polygon points="2,36 36,2 52,2 18,36 2,52" fill="#3b0764" stroke="#c084fc" stroke-width="1.5"/>
    <polygon points="8,8 24,8 8,24" fill="#c084fc"/>
  </g>
  <!-- Top Right -->
  <g>
    <polygon points="308,36 274,2 258,2 292,36 308,52" fill="#3b0764" stroke="#c084fc" stroke-width="1.5"/>
    <polygon points="302,8 286,8 302,24" fill="#c084fc"/>
  </g>
  <!-- Bottom Left -->
  <g>
    <polygon points="2,424 36,458 52,458 18,424 2,408" fill="#3b0764" stroke="#c084fc" stroke-width="1.5"/>
    <polygon points="8,452 24,452 8,436" fill="#c084fc"/>
  </g>
  <!-- Bottom Right -->
  <g>
    <polygon points="308,424 274,458 258,458 292,424 308,408" fill="#3b0764" stroke="#c084fc" stroke-width="1.5"/>
    <polygon points="302,452 286,452 302,436" fill="#c084fc"/>
  </g>

  <!-- Side Soul Conduit Crystals -->
  <circle cx="12" cy="230" r="4" fill="#c084fc" filter="drop-shadow(0 0 6px #c084fc)"/>
  <circle cx="298" cy="230" r="4" fill="#c084fc" filter="drop-shadow(0 0 6px #c084fc)"/>
</svg>