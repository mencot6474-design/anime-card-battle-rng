<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="2x Shiny Chance Pass">
  <defs>
    <radialGradient id="s2Glow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#7df9ff" stop-opacity="0.52"/>
      <stop offset="56%" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s2Frame" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="38%" stop-color="#7df9ff"/>
      <stop offset="76%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="s2Plate" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#13263d"/>
      <stop offset="55%" stop-color="#081322"/>
      <stop offset="100%" stop-color="#040811"/>
    </linearGradient>
    <linearGradient id="s2Star" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7df9ff"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="s2Txt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="58" fill="url(#s2Glow)"/>

  <!-- Crystal Side Shards -->
  <g stroke="#06090f" stroke-width="3.4" stroke-linejoin="round">
    <polygon points="31,47 10,36 18,56 10,65 29,73" fill="#0f233a"/>
    <polygon points="97,47 118,36 110,56 118,65 99,73" fill="#0f233a"/>
    <polygon points="31,52 17,45 22,59 31,64" fill="#7df9ff"/>
    <polygon points="97,52 111,45 106,59 97,64" fill="#7df9ff"/>
  </g>

  <!-- Pass Shield Frame -->
  <polygon points="44,16 84,16 102,34 102,88 64,114 26,88 26,34"
           fill="url(#s2Frame)" stroke="#06090f" stroke-width="4.2" stroke-linejoin="round"/>
  <polygon points="47,23 81,23 95,37 95,84 64,106 33,84 33,37"
           fill="url(#s2Plate)" stroke="#06090f" stroke-width="3" stroke-linejoin="round"/>

  <!-- Crystal bevel streaks -->
  <polygon points="38,76 86,28 91,33 43,81" fill="#e0f2fe" opacity="0.16"/>
  <polygon points="47,23 81,23 95,37 88,43 40,43 33,37" fill="#ffffff" opacity="0.1"/>

  <!-- Top crystal node -->
  <polygon points="64,10 73,19 64,28 55,19" fill="#ffffff" stroke="#06090f" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="64,13 69,19 64,25 59,19" fill="#7df9ff"/>

  <!-- Signature Prismatic 4-Point Shiny Star Centerpiece -->
  <g transform="translate(64,51)">
    <!-- Diagonal micro rays -->
    <polygon points="-16,-16 -5,-5 -9,-1" fill="#bae6fd" opacity="0.65"/>
    <polygon points="16,-16 5,-5 9,-1" fill="#bae6fd" opacity="0.65"/>
    <polygon points="-16,16 -5,5 -9,1" fill="#bae6fd" opacity="0.65"/>
    <polygon points="16,16 5,5 9,1" fill="#bae6fd" opacity="0.65"/>
    <!-- Main 4-point star -->
    <path d="M0,-26 L6.8,-6.8 L26,0 L6.8,6.8 L0,26 L-6.8,6.8 L-26,0 L-6.8,-6.8 Z"
          fill="url(#s2Star)" stroke="#05080f" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- Inner faceted core -->
    <path d="M0,-13 L3.6,-3.6 L13,0 L3.6,3.6 L0,13 L-3.6,3.6 L-13,0 L-3.6,-3.6 Z"
          fill="#ffffff" opacity="0.9"/>
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#f3e600" stroke="#05080f" stroke-width="1.8"/>
    <!-- Twin mini orbital stars -->
    <path d="M-21,-13 L-19.3,-8.7 L-15,-7 L-19.3,-5.3 L-21,-1 L-22.7,-5.3 L-27,-7 L-22.7,-8.7 Z"
          fill="#fef08a" stroke="#05080f" stroke-width="1.8"/>
    <path d="M21,3 L22.5,6.8 L26.5,8.3 L22.5,9.8 L21,13.5 L19.5,9.8 L15.5,8.3 L19.5,6.8 Z"
          fill="#fef08a" stroke="#05080f" stroke-width="1.8"/>
  </g>

  <!-- Bold "2x" Badge Plate -->
  <g transform="translate(64,85)">
    <polygon points="-29,-12 29,-12 34,-5 28,12 -28,12 -34,-5"
             fill="#040811" stroke="url(#s2Frame)" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M-22,-5 C-21.5,-9.5 -17.5,-11.5 -12.5,-11.5 C-7,-11.5 -3.5,-8.8 -3.5,-4.6 C-3.5,-1.6 -5.5,0.8 -10.5,4.2 L-15.2,7.3 L-3.2,7.3 L-3.2,11.8 L-22.5,11.8 L-22.5,7.8 L-13.2,1.6 C-10.2,-0.4 -9,-1.9 -9,-3.8 C-9,-5.7 -10.6,-6.9 -12.8,-6.9 C-15,-6.9 -16.4,-5.8 -16.8,-3.7 Z"
          transform="translate(0,-1)"
          fill="url(#s2Txt)" stroke="#05080f" stroke-width="3.2" stroke-linejoin="round" style="paint-order:stroke fill"/>
    <path d="M5,-6 L10.5,-6 L14.5,-1.2 L18.5,-6 L24,-6 L17.8,2 L24.2,10 L18.7,10 L14.5,4.8 L10.3,10 L4.8,10 L11.2,2 Z"
          transform="translate(0,-2)"
          fill="#fef08a" stroke="#05080f" stroke-width="3" stroke-linejoin="round" style="paint-order:stroke fill"/>
  </g>

  <!-- Outer Sparkles -->
  <g stroke="#06090f" stroke-width="2.2" stroke-linejoin="round">
    <path d="M22,19 L24.2,24.8 L30,27 L24.2,29.2 L22,35 L19.8,29.2 L14,27 L19.8,24.8 Z" fill="#7df9ff"/>
    <path d="M107,18 L109,23 L114,25 L109,27 L107,32 L105,27 L100,25 L105,23 Z" fill="#fef08a"/>
    <path d="M106,94 L107.8,98.2 L112,100 L107.8,101.8 L106,106 L104.2,101.8 L100,100 L104.2,98.2 Z" fill="#7df9ff"/>
  </g>
</svg>
