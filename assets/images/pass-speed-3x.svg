<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="3x Battle Speed Pass">
  <defs>
    <radialGradient id="spGlow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#f3e600" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wingCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="wingDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#283548"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldFrame" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="35%" stop-color="#f3e600"/>
      <stop offset="72%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="corePlate" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="52%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="chevOne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#7df9ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="chevTwo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f3e600"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="txtGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#f3e600"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Ambient energy halo -->
  <circle cx="64" cy="64" r="58" fill="url(#spGlow)"/>

  <!-- Swept turbo wings (left & right) -->
  <g stroke="#07090e" stroke-width="3.6" stroke-linejoin="round">
    <!-- Outer dark wing blades -->
    <polygon points="32,46 6,30 16,52 9,60 22,68 15,78 35,80" fill="url(#wingDark)"/>
    <polygon points="96,46 122,30 112,52 119,60 106,68 113,78 93,80" fill="url(#wingDark)"/>
    <!-- Inner cyan energy vanes -->
    <polygon points="34,51 15,40 24,57 18,64 36,68" fill="url(#wingCyan)"/>
    <polygon points="94,51 113,40 104,57 110,64 92,68" fill="url(#wingCyan)"/>
  </g>

  <!-- Chamfered Hazard Gold Pass Shield -->
  <polygon points="44,16 84,16 102,34 102,88 64,114 26,88 26,34"
           fill="url(#goldFrame)" stroke="#07090e" stroke-width="4.2" stroke-linejoin="round"/>

  <!-- Inner obsidian plate -->
  <polygon points="47,23 81,23 95,37 95,84 64,106 33,84 33,37"
           fill="url(#corePlate)" stroke="#07090e" stroke-width="3" stroke-linejoin="round"/>

  <!-- Top metallic specular bevel -->
  <polygon points="47,23 81,23 95,37 88,43 40,43 33,37"
           fill="#ffffff" opacity="0.08"/>

  <!-- Diagonal hazard / speed slash lines inside plate -->
  <g opacity="0.22" fill="#7df9ff">
    <polygon points="38,76 86,28 91,33 43,81"/>
    <polygon points="38,58 68,28 73,33 43,63"/>
    <polygon points="58,96 92,62 92,70 66,96"/>
  </g>

  <!-- Top crown diamond node -->
  <polygon points="64,10 73,19 64,28 55,19"
           fill="url(#chevOne)" stroke="#07090e" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="64,13 69,19 64,25 59,19" fill="#ffffff" opacity="0.55"/>

  <!-- Triple Fast-Forward Chevrons (>>>) surging upward/right -->
  <g stroke="#07090e" stroke-width="3.4" stroke-linejoin="round">
    <!-- Chevron 1 (leftmost, cyan) -->
    <polygon points="38,38 48,38 58,52 48,66 38,66 48,52" fill="url(#chevOne)"/>
    <!-- Chevron 2 (middle, bright cyan-white) -->
    <polygon points="55,36 66,36 77,52 66,68 55,68 66,52" fill="#ffffff"/>
    <polygon points="56,37 65,37 75.5,52 65,67 56,67 66.5,52" fill="url(#chevOne)" stroke="none"/>
    <!-- Chevron 3 (lead chevron, blazing hazard gold) -->
    <polygon points="73,38 84,38 94,52 84,66 73,66 83,52" fill="url(#chevTwo)"/>
  </g>

  <!-- Bold "3x" Badge Plate at bottom focal center -->
  <g transform="translate(64,84)">
    <!-- Dark capsule backing for maximum contrast -->
    <polygon points="-28,-12 28,-12 33,-5 27,12 -27,12 -33,-5"
             fill="#050811" stroke="url(#goldFrame)" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Vector "3" -->
    <path d="M-21,-8 L-4,-8 L-4,-3 L-11,1 C-6,1.8 -3.5,4.2 -3.5,7.5 C-3.5,12 -7.8,14.5 -14,14.5 C-19,14.5 -22.2,12.8 -23.5,10.2 L-18.2,7.8 C-17.4,9.2 -16,9.8 -14,9.8 C-11.4,9.8 -9.8,8.7 -9.8,7 C-9.8,5.3 -11.6,4.4 -14.8,4.4 L-16.8,4.4 L-16.8,0.4 L-11.2,-3.6 L-21,-3.6 Z"
          transform="translate(0,-3)"
          fill="url(#txtGold)" stroke="#07090e" stroke-width="3.4" stroke-linejoin="round" style="paint-order:stroke fill"/>
    <!-- Vector "×" -->
    <path d="M5,-6 L10.5,-6 L14.5,-1.2 L18.5,-6 L24,-6 L17.8,2 L24.2,10 L18.7,10 L14.5,4.8 L10.3,10 L4.8,10 L11.2,2 Z"
          transform="translate(0,-2)"
          fill="#7df9ff" stroke="#07090e" stroke-width="3.2" stroke-linejoin="round" style="paint-order:stroke fill"/>
  </g>

  <!-- Anime 4-point sparkles -->
  <g stroke="#07090e" stroke-width="2.2" stroke-linejoin="round">
    <path d="M22,19 L24.2,24.8 L30,27 L24.2,29.2 L22,35 L19.8,29.2 L14,27 L19.8,24.8 Z" fill="#f3e600"/>
    <path d="M107,18 L109,23 L114,25 L109,27 L107,32 L105,27 L100,25 L105,23 Z" fill="#7df9ff"/>
    <path d="M105,94 L106.8,98.2 L111,100 L106.8,101.8 L105,106 L103.2,101.8 L99,100 L103.2,98.2 Z" fill="#f3e600"/>
  </g>
</svg>
