<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="2x Luck Pass">
  <defs>
    <radialGradient id="l2Glow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="58%" stop-color="#f3e600" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="l2Frame" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="35%" stop-color="#34d399"/>
      <stop offset="75%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="l2Plate" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#11241f"/>
      <stop offset="55%" stop-color="#071310"/>
      <stop offset="100%" stop-color="#040908"/>
    </linearGradient>
    <linearGradient id="l2Leaf" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="45%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="l2Txt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="58" fill="url(#l2Glow)"/>

  <!-- Side fortune leaves / tech fins -->
  <g stroke="#060908" stroke-width="3.4" stroke-linejoin="round">
    <polygon points="31,48 11,36 18,55 11,64 29,72" fill="#0d2922"/>
    <polygon points="97,48 117,36 110,55 117,64 99,72" fill="#0d2922"/>
    <polygon points="31,52 18,45 23,58 31,64" fill="#34d399"/>
    <polygon points="97,52 110,45 105,58 97,64" fill="#34d399"/>
  </g>

  <!-- Pass Shield Frame -->
  <polygon points="44,16 84,16 102,34 102,88 64,114 26,88 26,34"
           fill="url(#l2Frame)" stroke="#060908" stroke-width="4.2" stroke-linejoin="round"/>
  <polygon points="47,23 81,23 95,37 95,84 64,106 33,84 33,37"
           fill="url(#l2Plate)" stroke="#060908" stroke-width="3" stroke-linejoin="round"/>

  <!-- Subtle diagonal gleam inside plate -->
  <polygon points="38,76 86,28 91,33 43,81" fill="#6ee7b7" opacity="0.16"/>
  <polygon points="47,23 81,23 95,37 88,43 40,43 33,37" fill="#ffffff" opacity="0.08"/>

  <!-- Top emerald node -->
  <polygon points="64,10 73,19 64,28 55,19" fill="#fef08a" stroke="#060908" stroke-width="3" stroke-linejoin="round"/>

  <!-- Four-leaf cyber clover centerpiece -->
  <g stroke="#050807" stroke-width="3.2" stroke-linejoin="round" transform="translate(64,51)">
    <!-- Top leaf -->
    <path d="M0,-2 C-9,-10 -12,-24 0,-26 C12,-24 9,-10 0,-2 Z" fill="url(#l2Leaf)"/>
    <!-- Bottom leaf -->
    <path d="M0,2 C-8,10 -11,21 0,23 C11,21 8,10 0,2 Z" fill="url(#l2Leaf)"/>
    <!-- Left leaf -->
    <path d="M-2,0 C-10,-9 -24,-12 -26,0 C-24,12 -10,9 -2,0 Z" fill="url(#l2Leaf)"/>
    <!-- Right leaf -->
    <path d="M2,0 C10,-9 24,-12 26,0 C24,12 10,9 2,0 Z" fill="url(#l2Leaf)"/>
    <!-- Clover veins -->
    <path d="M0,-6 L0,-19 M0,6 L0,16 M-6,0 L-19,0 M6,0 L19,0" stroke="#ecfdf5" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    <!-- Center gold core -->
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#f3e600" stroke="#050807" stroke-width="2.4"/>
  </g>

  <!-- Bold "2x" Badge Plate -->
  <g transform="translate(64,85)">
    <polygon points="-29,-12 29,-12 34,-5 28,12 -28,12 -34,-5"
             fill="#040807" stroke="url(#l2Frame)" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Vector "2" -->
    <path d="M-22,-5 C-21.5,-9.5 -17.5,-11.5 -12.5,-11.5 C-7,-11.5 -3.5,-8.8 -3.5,-4.6 C-3.5,-1.6 -5.5,0.8 -10.5,4.2 L-15.2,7.3 L-3.2,7.3 L-3.2,11.8 L-22.5,11.8 L-22.5,7.8 L-13.2,1.6 C-10.2,-0.4 -9,-1.9 -9,-3.8 C-9,-5.7 -10.6,-6.9 -12.8,-6.9 C-15,-6.9 -16.4,-5.8 -16.8,-3.7 Z"
          transform="translate(0,-1)"
          fill="url(#l2Txt)" stroke="#050807" stroke-width="3.2" stroke-linejoin="round" style="paint-order:stroke fill"/>
    <!-- Vector "×" -->
    <path d="M5,-6 L10.5,-6 L14.5,-1.2 L18.5,-6 L24,-6 L17.8,2 L24.2,10 L18.7,10 L14.5,4.8 L10.3,10 L4.8,10 L11.2,2 Z"
          transform="translate(0,-2)"
          fill="#f3e600" stroke="#050807" stroke-width="3" stroke-linejoin="round" style="paint-order:stroke fill"/>
  </g>

  <!-- Sparkles -->
  <g stroke="#060908" stroke-width="2.2" stroke-linejoin="round">
    <path d="M22,20 L24.2,25.6 L30,28 L24.2,30.4 L22,36 L19.8,30.4 L14,28 L19.8,25.6 Z" fill="#fef08a"/>
    <path d="M107,18 L109,23 L114,25 L109,27 L107,32 L105,27 L100,25 L105,23 Z" fill="#6ee7b7"/>
    <path d="M106,94 L107.8,98.2 L112,100 L107.8,101.8 L106,106 L104.2,101.8 L100,100 L104.2,98.2 Z" fill="#fef08a"/>
  </g>
</svg>
