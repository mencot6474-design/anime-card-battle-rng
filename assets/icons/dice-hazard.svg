<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 62" width="64" height="62" fill="none">
  <defs>
    <linearGradient id="diceTopGrad" x1="10" y1="6" x2="54" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#32384a"/>
      <stop offset="40%" stop-color="#222735"/>
      <stop offset="100%" stop-color="#141722"/>
    </linearGradient>
    <linearGradient id="diceLeftGrad" x1="10" y1="18" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c202c"/>
      <stop offset="50%" stop-color="#11141c"/>
      <stop offset="100%" stop-color="#080a0e"/>
    </linearGradient>
    <linearGradient id="diceRightGrad" x1="54" y1="18" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#242938"/>
      <stop offset="60%" stop-color="#151824"/>
      <stop offset="100%" stop-color="#0c0e15"/>
    </linearGradient>
    <radialGradient id="dicePipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#f3e600"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <filter id="diceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Face -->
  <polygon points="10,18 32,30 32,56 10,44" fill="url(#diceLeftGrad)" stroke="#f3e600" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Left Pips -->
  <g fill="url(#dicePipGlow)" filter="url(#diceGlow)">
    <ellipse cx="21" cy="31" rx="2.8" ry="3.8" transform="rotate(15 21 31)"/>
    <ellipse cx="21" cy="45" rx="2.8" ry="3.8" transform="rotate(15 21 45)"/>
  </g>

  <!-- Right Face -->
  <polygon points="32,30 54,18 54,44 32,56" fill="url(#diceRightGrad)" stroke="#f3e600" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Right Pips -->
  <g fill="url(#dicePipGlow)" filter="url(#diceGlow)">
    <ellipse cx="43" cy="28" rx="2.8" ry="3.8" transform="rotate(-15 43 28)"/>
    <ellipse cx="43" cy="39" rx="2.8" ry="3.8" transform="rotate(-15 43 39)"/>
    <ellipse cx="43" cy="50" rx="2.8" ry="3.8" transform="rotate(-15 43 50)"/>
  </g>

  <!-- Top Face -->
  <polygon points="32,6 54,18 32,30 10,18" fill="url(#diceTopGrad)" stroke="#f3e600" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Top Center Pip (Ace Hazard Core: Glowing Pip with Diamond Halo) -->
  <g filter="url(#diceGlow)">
    <polygon points="32,11 41,18 32,25 23,18" fill="none" stroke="#f3e600" stroke-width="1" opacity="0.65"/>
    <ellipse cx="32" cy="18" rx="4.5" ry="2.8" fill="url(#dicePipGlow)"/>
    <ellipse cx="32" cy="17.5" rx="2.2" ry="1.3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Specular Edge Glints -->
  <polyline points="10,18 32,6 54,18" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <line x1="32" y1="6" x2="32" y2="30" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
</svg>
