<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ DEMO SHOWCASE: 6 ARCHETYPE ANIME BASIC ATTACKS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at 50% 30%, #1e102f, #080312 85%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.6rem;
      background: linear-gradient(90deg, #f59e0b, #ec4899, #8b5cf6, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 900;
      margin-bottom: 4px;
    }
    p.sub {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    /* BATTLE ARENA */
    .arena {
      position: relative;
      width: 100%;
      max-width: 680px;
      height: 380px;
      background: rgba(15, 7, 32, 0.7);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 0 40px rgba(139,92,246,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    /* Grid lines lantai arena */
    .arena::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* CARD BOX */
    .fighter {
      position: relative;
      width: 130px;
      height: 185px;
      background: #18112b;
      border: 2px solid #6366f1;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      z-index: 10;
      transition: transform 0.1s ease;
    }
    .fighter.me {
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }
    .fighter.foe {
      border-color: #f43f5e;
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.3);
    }

    .fighter .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #251b45;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      border: 2px solid rgba(255,255,255,0.2);
      margin-top: 6px;
    }
    .fighter .name {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
    }
    .fighter.me .name { color: #38bdf8; }
    .fighter.foe .name { color: #f43f5e; }

    .fighter .role-tag {
      font-size: 0.65rem;
      background: rgba(255,255,255,0.1);
      padding: 2px 8px;
      border-radius: 10px;
      color: #cbd5e1;
    }

    /* HP BAR */
    .hp-bar-wrap {
      width: 100%;
      height: 8px;
      background: #0f0b1e;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .hp-bar {
      height: 100%;
      width: 100%;
      background: #22c55e;
      transition: width 0.3s ease;
    }

    /* CARD HIT REACTION ANIMATIONS */
    .fighter.hit {
      animation: shakeHit 0.35s ease-out;
    }
    @keyframes shakeHit {
      0% { transform: translate(0, 0); }
      20% { transform: translate(12px, -6px) rotate(4deg); }
      40% { transform: translate(-10px, 6px) rotate(-3deg); }
      60% { transform: translate(6px, -4px) rotate(2deg); }
      80% { transform: translate(-4px, 2px); }
      100% { transform: translate(0, 0); }
    }

    .fighter.lunge-right {
      animation: lungeRight 0.25s ease-out;
    }
    @keyframes lungeRight {
      0% { transform: translate(0, 0); }
      50% { transform: translate(30px, 0) scale(1.05); }
      100% { transform: translate(0, 0); }
    }

    /* CONTROLS & BUTTONS */
    .controls {
      width: 100%;
      max-width: 680px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-archetype {
      background: #1a1330;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      color: #fff;
      text-align: left;
    }
    .btn-archetype:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      border-color: rgba(255,255,255,0.4);
    }
    .btn-archetype:active {
      transform: scale(0.97);
    }

    .btn-archetype .icon {
      font-size: 1.6rem;
      min-width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.06);
    }
    .btn-archetype .info {
      flex: 1;
    }
    .btn-archetype .title {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
    }
    .btn-archetype .desc {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* THEMES FOR BUTTONS */
    .btn-lightning:hover { border-color: #facc15; box-shadow: 0 0 20px rgba(250, 204, 21, 0.35); }
    .btn-fire:hover { border-color: #f97316; box-shadow: 0 0 20px rgba(249, 115, 22, 0.35); }
    .btn-ice:hover { border-color: #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.35); }
    .btn-blade:hover { border-color: #00f5d4; box-shadow: 0 0 20px rgba(0, 245, 212, 0.35); }
    .btn-energy:hover { border-color: #c084fc; box-shadow: 0 0 20px rgba(192, 132, 252, 0.35); }
    .btn-brawler:hover { border-color: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.35); }

    /* SWITCH DIRECTION */
    .options-bar {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 14px;
    }
    .switch-btn {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .log-box {
      font-size: 0.75rem;
      color: #a855f7;
      font-family: monospace;
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ ANIME COMBAT VFX LAB</h1>
    <p class="sub">Showcase interaktif 6 archetype animasi basic attack (Proyektil, Impact Frames & SFX)</p>
  </header>

  <div class="options-bar">
    <span id="directionText">Arah Serangan: <strong>PLAYER ➔ MUSUH</strong></span>
    <button class="switch-btn" onclick="toggleDirection()">🔄 Balikkan Arah</button>
  </div>

  <div class="arena" id="arenaBox">
    <!-- PLAYER CARD -->
    <div class="fighter me" id="cardPlayer">
      <div class="role-tag">PLAYER</div>
      <div class="avatar" id="playerAvatar">⚔️</div>
      <div class="name" id="playerName">HERO CARD</div>
      <div class="hp-bar-wrap"><div class="hp-bar" id="playerHp"></div></div>
    </div>

    <!-- FOE CARD -->
    <div class="fighter foe" id="cardFoe">
      <div class="role-tag">ENEMY</div>
      <div class="avatar" id="foeAvatar">👹</div>
      <div class="name" id="foeName">TARGET FOE</div>
      <div class="hp-bar-wrap"><div class="hp-bar" id="foeHp"></div></div>
    </div>
  </div>

  <div class="log-box" id="logBox">Klik salah satu tombol serangan di bawah untuk melihat animasi!</div>

  <!-- CONTROLS -->
  <div class="controls">
    <!-- 1. LIGHTNING -->
    <button class="btn-archetype btn-lightning" onclick="triggerAttack('lightning')">
      <div class="icon">⚡</div>
      <div class="info">
        <div class="title"><span>1. LIGHTNING</span> <span style="color:#facc15">SPEED</span></div>
        <div class="desc">Zenitsu / Killua / Chidori. Kilatan zig-zag & petir warp beruntun.</div>
      </div>
    </button>

    <!-- 2. FIRE -->
    <button class="btn-archetype btn-fire" onclick="triggerAttack('fire')">
      <div class="icon">🔥</div>
      <div class="info">
        <div class="title"><span>2. FIRE / KATON</span> <span style="color:#f97316">BLAST</span></div>
        <div class="desc">Sasuke / Ace / Rengoku. Bola api berputar + ledakan bara api.</div>
      </div>
    </button>

    <!-- 3. ICE -->
    <button class="btn-archetype btn-ice" onclick="triggerAttack('ice')">
      <div class="icon">❄️</div>
      <div class="info">
        <div class="title"><span>3. ICE / CRYO</span> <span style="color:#38bdf8">SHATTER</span></div>
        <div class="desc">Hitsugaya / Rukia / Gray. Kristal es runcing & ledakan pecahan es.</div>
      </div>
    </button>

    <!-- 4. BLADE -->
    <button class="btn-archetype btn-blade" onclick="triggerAttack('blade')">
      <div class="icon">🗡️</div>
      <div class="info">
        <div class="title"><span>4. BLADE / SWORD</span> <span style="color:#00f5d4">SLASH</span></div>
        <div class="desc">Tanjiro / Meliodas / Zoro. Gelombang sabit tebasan tajam membelah.</div>
      </div>
    </button>

    <!-- 5. ENERGY -->
    <button class="btn-archetype btn-energy" onclick="triggerAttack('energy')">
      <div class="icon">🔮</div>
      <div class="info">
        <div class="title"><span>5. ENERGY / NEN</span> <span style="color:#c084fc">BURST</span></div>
        <div class="desc">Gon / Hisoka / Magic. Bola aura spiral dan shockwave cincin energi.</div>
      </div>
    </button>

    <!-- 6. BRAWLER -->
    <button class="btn-archetype btn-brawler" onclick="triggerAttack('brawler')">
      <div class="icon">👊</div>
      <div class="info">
        <div class="title"><span>6. BRAWLER / PUNCH</span> <span style="color:#ef4444">IMPACT</span></div>
        <div class="desc">Rock Lee / Luffy / Goku. Sonic jet trail + Impact Frame hitam-putih.</div>
      </div>
    </button>
  </div>

  <!-- LOAD THE ARCHETYPE SCRIPT -->
  <script src="js/anime-archetype-attacks.js"></script>

  <script>
    var directionMeToFoe = true;

    function toggleDirection(){
      directionMeToFoe = !directionMeToFoe;
      var text = document.getElementById("directionText");
      if(directionMeToFoe){
        text.innerHTML = "Arah Serangan: <strong>PLAYER ➔ MUSUH</strong>";
      } else {
        text.innerHTML = "Arah Serangan: <strong>MUSUH ➔ PLAYER</strong>";
      }
    }

    function triggerAttack(type){
      var fromSel = directionMeToFoe ? "#cardPlayer" : "#cardFoe";
      var toSel = directionMeToFoe ? "#cardFoe" : "#cardPlayer";
      var fromEl = document.querySelector(fromSel);
      var toEl = document.querySelector(toSel);

      // Lunge penyerang
      fromEl.classList.remove("lunge-right");
      void fromEl.offsetWidth;
      fromEl.classList.add("lunge-right");

      // Reaction target saat kena proyektil (~200ms)
      setTimeout(function(){
        toEl.classList.remove("hit");
        void toEl.offsetWidth;
        toEl.classList.add("hit");
      }, 200);

      var log = document.getElementById("logBox");
      log.innerText = "▶ Executing " + type.toUpperCase() + " attack animation...";

      // Eksekusi animasi sesuai archetype
      if(window.playAnimeArchetypeAttack){
        // Kirim dummy id agar router script mendeteksi archetypenya
        var mockId = "";
        if(type === "lightning") mockId = "CH_ZENITSU";
        else if(type === "fire") mockId = "CH_FIREBALL_SASUKE";
        else if(type === "ice") mockId = "CH_CAPTAIN_HITSUGAYA";
        else if(type === "blade") mockId = "CH_TANJIRO";
        else if(type === "energy") mockId = "CH_WILDHEART_GON";
        else mockId = "CH_LEE";

        window.playAnimeArchetypeAttack(mockId, fromSel, toSel);
      }
    }
  </script>
</body>
</html>
